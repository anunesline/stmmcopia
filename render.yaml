services:
  - type: web
    name: stmm-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn wsgi:app --host 0.0.0.0 --port 10000
    envVars:
      - key: JWT_SECRET
        value: secreto-123-change-me
      - key: ADMIN_EMAIL
        value: admin@stmm.com
      - key: ADMIN_PASSWORD
        value: admin123456
